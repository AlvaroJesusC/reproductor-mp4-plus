name: Publicar Release con APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre de la versión (ej: v1.0.1)'
        required: true
        default: 'v1.0.1'
      release_title:
        description: 'Título del Release'
        required: false
        default: 'Nueva Versión de Reproductor MP4'
      release_notes:
        description: 'Notas del cambio / Novedades'
        required: false
        default: 'Nuevas mejoras, correcciones y optimizaciones.'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compilar APK y Publicar en GitHub
    runs-on: ubuntu-latest

    steps:
      - name: Clonar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK en Modo Release
        run: flutter build apk --release

      - name: Renombrar APK con la versión
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/reproductor-mp4-${TAG}.apk"

      - name: Crear Release y Subir APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_title || github.ref_name }}
          body: ${{ github.event.inputs.release_notes || 'Nueva actualización disponible.' }}
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/reproductor-mp4-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

